name: Build

# Verifies that every exercise file in the repo still compiles with zero
# `sorry`s, on every push and pull request.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Get Mathlib cache
        run: lake exe cache get

      - name: Build
        run: lake build

      - name: Fail if any file contains `sorry`
        run: |
          if grep -rl --include="*.lean" '\bsorry\b' . ; then
            echo "::error::Found 'sorry' in the files listed above."
            exit 1
          fi
